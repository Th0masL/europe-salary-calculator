name: Validate calculator

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python tools
        run: python -m compileall -q tools tests
      - name: Run structural regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate generated datasets
        run: python tools/validate_data.py
      - name: Check browser JavaScript syntax
        run: node --check app.js
